# =============================================================================
# Fraud Shield - Deployment Docker Compose
#
# PURPOSE:
#   Deploy Fraud Shield using Docker images already built by GitHub Actions
#   and pushed to GitHub Container Registry (GHCR).
#
# IMPORTANT:
#   - Application images are NOT built here.
#   - No "build:" section exists for our 9 application services.
#   - Infrastructure images are pulled from their public registries.
#   - Secrets remain external and are supplied at runtime through .env files.
# =============================================================================

services:

  # ===========================================================================
  # DATABASE / ADMIN
  # ===========================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fraud-shield-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fraudshield.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - fraud-shield-network
    depends_on:
      - postgres


  postgres:
    image: postgres:15
    container_name: fraud-shield-postgres
    environment:
      POSTGRES_DB: fraudshielddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  mongo-express:
    image: mongo-express:latest
    container_name: fraud-shield-mongo-express
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - fraud-shield-network
    depends_on:
      - mongodb


  mongodb:
    image: mongo:6
    container_name: fraud-shield-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ===========================================================================
  # REDIS
  # ===========================================================================

  redis:
    image: redis:7-alpine
    container_name: fraud-shield-redis
    ports:
      - "6379:6379"
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ===========================================================================
  # KAFKA + ZOOKEEPER
  # ===========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fraud-shield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-shield-network


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fraud-shield-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      # Host applications:
      # localhost:9092
      #
      # Docker containers:
      # kafka:29092
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list"
        ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s


  # ===========================================================================
  # OBSERVABILITY
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-shield-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraud-shield-network


  grafana:
    image: grafana/grafana:latest
    container_name: fraud-shield-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - fraud-shield-network
    depends_on:
      - prometheus
      - loki


  loki:
    image: grafana/loki:latest
    container_name: fraud-shield-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fraud-shield-network


  alloy:
    image: grafana/alloy:latest
    container_name: fraud-shield-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/log:/var/log:ro
    command: >-
      run --server.http.listen-addr=0.0.0.0:12345
      /etc/alloy/config.alloy
    networks:
      - fraud-shield-network
    depends_on:
      - loki


  tempo:
    image: grafana/tempo:1.5.0
    container_name: fraud-shield-tempo
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    networks:
      - fraud-shield-network


  # ===========================================================================
  # FRAUD SHIELD APPLICATION SERVICES
  #
  # IMPORTANT:
  # These images come from GHCR.
  #
  # There are intentionally NO build: sections here.
  # ===========================================================================


  # ===========================================================================
  # EUREKA SERVER
  # ===========================================================================

  eureka-server:
    image: ghcr.io/saurav-kumarr/fraud-shield/eureka-server:${IMAGE_TAG:-latest}
    container_name: fraud-shield-eureka-server

    ports:
      - "8761:8761"

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8761/"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s


  # ===========================================================================
  # CONFIG SERVER
  # ===========================================================================

  config-server:
    image: ghcr.io/saurav-kumarr/fraud-shield/config-server:${IMAGE_TAG:-latest}
    container_name: fraud-shield-config-server

    ports:
      - "8888:8888"

    environment:
      SPRING_PROFILES_ACTIVE: docker,native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: >-
        http://eureka-server:8761/eureka/

    depends_on:
      eureka-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8888/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # API GATEWAY
  # ===========================================================================

  api-gateway:
    image: ghcr.io/saurav-kumarr/fraud-shield/api-gateway:${IMAGE_TAG:-latest}
    container_name: fraud-shield-api-gateway

    env_file:
      - ./api-gateway/.env

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # TRANSACTION SERVICE
  # ===========================================================================

  transaction-service:
    image: ghcr.io/saurav-kumarr/fraud-shield/transaction-service:${IMAGE_TAG:-latest}
    container_name: fraud-shield-transaction-service

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      redis:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8081/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # FRAUD DETECTION SERVICE
  # ===========================================================================

  fraud-detection-service:
    image: ghcr.io/saurav-kumarr/fraud-shield/fraud-detection-service:${IMAGE_TAG:-latest}
    container_name: fraud-shield-fraud-detection-service

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

      redis:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8082/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # ALERT SERVICE
  # ===========================================================================

  alert-service:
    image: ghcr.io/saurav-kumarr/fraud-shield/alert-service:${IMAGE_TAG:-latest}
    container_name: fraud-shield-alert-service

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8083/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # USER SERVICE
  # ===========================================================================

  user-service:
    image: ghcr.io/saurav-kumarr/fraud-shield/user-service:${IMAGE_TAG:-latest}
    container_name: fraud-shield-user-service

    env_file:
      - ./user-service/.env

    ports:
      - "8084:8084"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # Required because Spring Cloud Bus / Kafka exists in user-service.
      # Containers must communicate with Kafka using its Docker DNS name.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8084/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # REPORT SERVICE
  # ===========================================================================

  report-service:
    image: ghcr.io/saurav-kumarr/fraud-shield/report-service:${IMAGE_TAG:-latest}
    container_name: fraud-shield-report-service

    ports:
      - "8085:8085"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      postgres:
        condition: service_healthy

      mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

      config-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8085/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ===========================================================================
  # REACT DASHBOARD
  # ===========================================================================

  fraud-shield-dashboard:
    image: ghcr.io/saurav-kumarr/fraud-shield/fraud-shield-dashboard:${IMAGE_TAG:-latest}
    container_name: fraud-shield-dashboard

    ports:
      - "5173:80"

    depends_on:
      api-gateway:
        condition: service_healthy

      alert-service:
        condition: service_healthy

      config-server:
        condition: service_healthy

      eureka-server:
        condition: service_healthy

    networks:
      - fraud-shield-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost/"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s


# =============================================================================
# NETWORK
# =============================================================================

networks:
  fraud-shield-network:
    driver: bridge


# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
  loki_data:
  tempo_data: