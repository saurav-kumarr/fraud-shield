name: Deploy Fraud Shield

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Docker
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        shell: powershell
        run: |
          docker version
          docker compose version

      # Create runtime environment files.
      # Both services intentionally receive the same JWT secret.
      - name: Create deployment environment files
        shell: powershell
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          "JWT_SECRET=$env:JWT_SECRET" | Set-Content -Path "api-gateway\.env"
          "JWT_SECRET=$env:JWT_SECRET" | Set-Content -Path "user-service\.env"

#      - name: Login to GHCR
#        shell: powershell
#        run: |
#          "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io `
#            -u "${{ secrets.GHCR_USERNAME }}" `
#            --password-stdin

      - name: Pull latest images
        shell: powershell
        run: |
          docker compose -f docker-compose.deploy.yml pull

      - name: Deploy Fraud Shield
        shell: powershell
        run: |
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans

      - name: Show deployment status
        shell: powershell
        run: |
          docker compose -f docker-compose.deploy.yml ps

      - name: Remove temporary environment files
        if: always()
        shell: powershell
        run: |
          Remove-Item "api-gateway\.env" -Force -ErrorAction SilentlyContinue
          Remove-Item "user-service\.env" -Force -ErrorAction SilentlyContinue