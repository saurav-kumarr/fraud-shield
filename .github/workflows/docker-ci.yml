# Builds and pushes Docker images for the 8 Fraud Shield microservices.
# Runs automatically on every push to main.
#
# IMPORTANT: this workflow only builds/pushes the 8 services YOU wrote.
# It does NOT touch postgres, mongo, redis, kafka, grafana, etc. - those are
# public third-party images pulled straight from Docker Hub, not built by you,
# and must never be pushed to your own registry (see note below).
name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The exact 8 service names from docker-compose.yml - reused in both steps
# below so the list only has to be maintained in one place.
env:
  SERVICES: >-
    eureka-server config-server api-gateway transaction-service
    fraud-detection-service alert-service user-service report-service
    fraud-shield-dashboard

jobs:
  docker:
    runs-on: ubuntu-latest
    # If a build genuinely hangs (network issue our retry loop inside the
    # Dockerfiles can't recover from), fail clearly after 45 minutes instead
    # of silently running for GitHub's default 6-hour job limit.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write       # needed to push images to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only builds services that have a "build:" section in docker-compose.yml
      # (your 8 microservices) - postgres/mongo/redis/etc. are skipped
      # automatically since they only have "image:" with no "build:".
      #
      # COMPOSE_PARALLEL_LIMIT=2: GitHub's free runners have only 2 CPU cores.
      # Each service does a fresh, uncached Maven dependency download inside
      # its own Docker build - running all 8 at once would fight over the
      # same 2 cores and makes hitting a flaky network moment (like the
      # DNS/download failures we saw locally) far more likely. Building 2 at
      # a time is slower overall but far more reliable.
      - name: Build images
        env:
          COMPOSE_PARALLEL_LIMIT: 2
        run: docker compose build $SERVICES

      # IMPORTANT FIX: "docker compose push" with no arguments tries to push
      # EVERY service that has an "image:" field - including postgres:15,
      # mongo:6, redis:7-alpine etc. That would fail (you don't own those
      # image names on the registry) and could break the whole pipeline.
      # Passing the explicit service list pushes ONLY what you built.
      - name: Push images
        run: docker compose push $SERVICES