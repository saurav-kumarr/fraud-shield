# =============================================================================
# Build & Push Docker Images (v2 - changed-service detection + Buildx Bake)
#
# Two jobs:
#   1. detect - figures out which services actually changed since the last
#      successful build (via the last-ci-build git tag), outputs the list.
#   2. build  - only runs if something changed; builds + pushes exactly
#      those services using docker-bake.hcl, then moves last-ci-build to
#      this commit so the next run diffs from here.
#
# Manual trigger only (workflow_dispatch) - intentional, not a placeholder.
# This repo has other workflows that already trigger on push; enabling an
# automatic push trigger here would create conflicts/noise alongside them.
# =============================================================================
name: Build & Push Docker Images

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # Intentionally disabled - see note above. Re-enable only if/when the
  # other workflows' triggers are reconciled with this one.

permissions:
  contents: write   # needed to move the last-ci-build tag after success
  packages: write   # needed to push images to GitHub Container Registry

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags required for the git diff

      - name: Detect changed services
        id: detect
        run: |
          chmod +x .github/scripts/detect-services.sh
          SERVICES=$(.github/scripts/detect-services.sh)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [ -z "$SERVICES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed services: $SERVICES"

  build:
    name: Build & push changed services
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # bake reads docker-bake.hcl directly - it does NOT parse
      # docker-compose.yml, so the old "touch .env" workaround (needed
      # because compose validates env_file: paths even at build time) is no
      # longer necessary and has been removed.
      - name: Build & push changed services
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker buildx bake -f docker-bake.hcl --push ${{ needs.detect.outputs.services }}

      # Moves the baseline forward so the NEXT run's diff starts from here -
      # this is what makes changed-service detection work correctly even
      # with sporadic manual triggers instead of a trigger on every push.
      - name: Move last-ci-build tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f last-ci-build
          git push origin last-ci-build --force

  deploy:
      name: Deploy
      # Runs after build succeeds, using the SAME services list detect already
      # computed - no artifacts or cross-workflow data passing needed, since
      # this is a job within the same workflow run, not a separate workflow.
      needs: [ detect, build ]
      if: needs.detect.outputs.has_changes == 'true'
      uses: ./.github/workflows/deploy.yml
      with:
        services: ${{ needs.detect.outputs.services }}
        image_tag: ${{ github.sha }}
      secrets:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}


