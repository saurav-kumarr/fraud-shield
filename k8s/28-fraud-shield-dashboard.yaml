# =============================================================================
#  fraud-shield-dashboard
#  Different from the 8 backend services: this is nginx serving static files
#  and reverse-proxying /api and /ws - it doesn't need SPRING_PROFILES_ACTIVE
#  or any Spring config at all. The api-gateway and alert-service hostnames
#  it proxies to are baked into nginx.conf at image build time, and work
#  unchanged here since the K8s Service names match Docker Compose's exactly.
#
#  Unlike Docker Compose's depends_on, Kubernetes has no native "wait for
#  api-gateway to be healthy before starting" mechanism - pods start in
#  parallel. That's fine here: nginx doesn't need api-gateway at startup,
#  only when a browser actually makes a request through it.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-shield-dashboard
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: fraud-shield-dashboard }
  template:
    metadata:
      labels: { app: fraud-shield-dashboard }
    spec:
      containers:
        - name: fraud-shield-dashboard
          image: ghcr.io/saurav-kumarr/fraud-shield/fraud-shield-dashboard:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
# NodePort exposes the dashboard outside the cluster - this is the second
# (and only other) public door, alongside api-gateway's NodePort.
apiVersion: v1
kind: Service
metadata:
  name: fraud-shield-dashboard
  namespace: fraud-shield
spec:
  type: NodePort
  selector: { app: fraud-shield-dashboard }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
