apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-service }
  template:
    metadata:
      labels: { app: alert-service }
    spec:
      containers:
        - name: alert-service
          image: ghcr.io/saurav-kumarr/fraud-shield/alert-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: fraud-shield
spec:
  selector: { app: alert-service }
  ports:
    - port: 8083
      targetPort: 8083
