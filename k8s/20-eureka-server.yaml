apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server }
    spec:
      containers:
        - name: eureka-server
          image: ghcr.io/saurav-kumarr/fraud-shield/eureka-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: fraud-shield
spec:
  selector: { app: eureka-server }
  ports:
    - port: 8761
      targetPort: 8761
