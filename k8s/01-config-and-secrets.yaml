# =============================================================================
#  Secrets only - no ConfigMap needed anymore.
#
#  Every hostname, port, and connection setting that used to live in a
#  ConfigMap here is now already inside each service's own
#  application-docker.yml (committed in their source trees) - reused
#  unchanged from Docker Compose, since Kafka's port was aligned to match.
#
#  The ONLY thing that genuinely needs external injection is the JWT secret,
#  since application-docker.yml references it as ${JWT_SECRET} rather than
#  hardcoding it - same principle as everywhere else in this project.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fraud-shield-secrets
  namespace: fraud-shield
type: Opaque
stringData:
  # Must be IDENTICAL to what api-gateway verifies with - it's a shared
  # HMAC key, not a public/private pair. For a real deployment, generate
  # this with `kubectl create secret` or a secrets manager instead of
  # committing a real value to Git.
  JWT_SECRET: "DockerComposeDevJwtSecretPleaseChangeInProd1234567890ABCDEFGH"
