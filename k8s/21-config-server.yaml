apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server }
    spec:
      containers:
        - name: config-server
          image: ghcr.io/saurav-kumarr/fraud-shield/config-server:latest
          ports:
            - containerPort: 8888
          env:
            # native = required for Config Server's own filesystem-backed
            # mode; docker = picks up Docker/K8s hostname overrides. Must be
            # comma-separated together, matching the docker-compose fix -
            # setting just "docker" alone would silently drop "native".
            - name: SPRING_PROFILES_ACTIVE
              value: docker,native
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: fraud-shield
spec:
  selector: { app: config-server }
  ports:
    - port: 8888
      targetPort: 8888
