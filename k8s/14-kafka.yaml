# =============================================================================
#  Kafka
#  Port aligned to 29092 (not 9092) so every service's EXISTING application-
#  docker.yml works completely unchanged here - it already points to
#  "kafka:29092" (that was the internal listener needed for Docker Compose).
#  Reusing the same port means we reuse the same Spring profile too - no new
#  k8s-specific config files needed anywhere.
#
#  In Docker Compose we needed TWO listeners because the HOST machine and
#  CONTAINERS reached Kafka differently. Inside Kubernetes, everything -
#  including `kubectl port-forward` from your own machine - goes through the
#  same cluster network via the Service name, so ONE listener is enough.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.4.0
          ports:
            - containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests: { memory: "512Mi", cpu: "200m" }
            limits:   { memory: "1Gi", cpu: "500m" }
          readinessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fraud-shield
spec:
  selector: { app: kafka }
  ports:
    - port: 29092
      targetPort: 29092
