apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fraud-shield
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/saurav-kumarr/fraud-shield/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            # api-gateway validates the JWT, so it needs the same signing
            # secret user-service used to issue it (HMAC = shared secret).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: fraud-shield-secrets, key: JWT_SECRET }
          resources:
            requests: { memory: "256Mi", cpu: "150m" }
            limits:   { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
# NodePort exposes the gateway outside the cluster - this is your ONE public
# door, exactly like it was in your original architecture (Part 2 of your
# Master Guide: "backend services are NOT exposed, only the gateway is").
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fraud-shield
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
