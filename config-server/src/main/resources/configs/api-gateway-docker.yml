# =============================================================================
#  api-gateway - Docker profile configuration
#  Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
#  Self-sufficient: every setting needed to run inside Docker lives here, so
#  this service does NOT depend on Config Server being reachable to start
#  correctly (spring.config.import below is a bonus/backup, not a hard
#  requirement). Every 'localhost' from the original config has been replaced
#  with the correct Docker service name.
# =============================================================================


server:
  port: 8080

spring:
  cloud:
#    function:
#      definition: none
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: merchant-registration
              uri: lb://user-service
              predicates:
                - Path=/api/merchant/**

            - id: b2b-transactions
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**

            - id: fraud-service
              uri: lb://fraud-detection-service
              predicates:
                - Path=/api/fraud/**

            - id: alert-service
              uri: lb://alert-service
              predicates:
                - Path=/api/alerts/**

            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/api/reports/**

  web:
    cors:
      allowed-origin-patterns:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "http://localhost:*"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
  data:
    redis:
      host: redis
      port: 6379

security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans