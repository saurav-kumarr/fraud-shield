# =============================================================================
#  report-service - Docker profile configuration
#  Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
#  Self-sufficient: every setting needed to run inside Docker lives here, so
#  this service does NOT depend on Config Server being reachable to start
#  correctly (spring.config.import below is a bonus/backup, not a hard
#  requirement). Every 'localhost' from the original config has been replaced
#  with the correct Docker service name.
# =============================================================================


server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/fraudshielddb?TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    mongodb:
      uri: mongodb://mongodb:27017/fraudshielddb
      database: fraudshielddb

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: report-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.fraudshield.fraud.dto.FraudAlertEvent:com.fraudshield.report.dto.FraudAlertEvent"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

  cloud:
    stream:
      kafka:
        binder:
          consumer-properties:
            value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer


kafka:
  topic:
    fraud-alerts: fraud-alerts

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://tempo:9411/api/v2/spans