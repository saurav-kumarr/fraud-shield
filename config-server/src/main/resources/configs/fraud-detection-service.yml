# =============================================================================
#  fraud-detection-service - Docker profile configuration
#  Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
#  Self-sufficient: every setting needed to run inside Docker lives here, so
#  this service does NOT depend on Config Server being reachable to start
#  correctly (spring.config.import below is a bonus/backup, not a hard
#  requirement). Every 'localhost' from the original config has been replaced
#  with the correct Docker service name.
# =============================================================================


server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/fraudshielddb
      database: fraudshielddb

    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Change the value deserializer to the Error Handler
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      #value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Tell the Error Handler to use JSON underneath
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "transactionEvent:com.fraudshield.fraud.dto.TransactionEvent"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: 3
  cloud:
    stream:
          kafka:
            binder:
              consumer-properties:
                value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
                key.deserializer: org.apache.kafka.common.serialization.StringDeserializer

kafka:
  topic:
    transaction-events: transaction-events
    fraud-alerts: fraud-alerts

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
