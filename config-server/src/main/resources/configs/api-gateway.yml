server:
  port: 8080

spring:
  cloud:
#    function:
#      definition: none
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**

            - id: fraud-service
              uri: lb://fraud-detection-service
              predicates:
                - Path=/api/fraud/**

            - id: alert-service
              uri: lb://alert-service
              predicates:
                - Path=/api/alerts/**

            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/api/reports/**

security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"