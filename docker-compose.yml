# =============================================================================
#  Fraud Shield - Complete Docker Compose Stack
#  Builds and runs all 8 microservices + all infrastructure together.
#
#  IMPORTANT FIXES vs your original file (explained fully in DOCKER_SETUP_GUIDE.md):
#   1. Kafka now has a SECOND internal listener (kafka:29092) for container-to-
#      container traffic. Your original only advertised "localhost:9092", which
#      only works from your HOST machine, not from other containers.
#   2. Every microservice gets its DB/Kafka/Redis/Eureka addresses overridden via
#      environment variables to use container/service names (e.g. "postgres",
#      "kafka:29092") instead of "localhost" - localhost inside a container
#      means "this container", not the other one.
# =============================================================================

services:

  # ===========================================================================
  # INFRASTRUCTURE (your original services, with healthchecks + the Kafka fix)
  # ===========================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fraud-shield-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fraudshield.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - fraud-shield-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: fraud-shield-postgres
    environment:
      POSTGRES_DB: fraudshielddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: fraud-shield-mongo-express
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - fraud-shield-network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: fraud-shield-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraud-shield-redis
    ports:
      - "6379:6379"
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fraud-shield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-shield-network

  # ---- FIX #1: Kafka now has TWO listeners ----
  # PLAINTEXT (localhost:9092)        -> for tools on your HOST machine
  # PLAINTEXT_INTERNAL (kafka:29092)  -> for OTHER CONTAINERS to reach Kafka
  # Your original config only had the first one, which breaks container-to-
  # container communication (a very common real-world Kafka+Docker mistake).
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fraud-shield-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-shield-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraud-shield-network

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-shield-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - fraud-shield-network
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: fraud-shield-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fraud-shield-network

  alloy:
    image: grafana/alloy:latest
    container_name: fraud-shield-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/log:/var/log:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - fraud-shield-network
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:1.5.0
    container_name: fraud-shield-tempo
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    networks:
      - fraud-shield-network

  # ===========================================================================
  # MICROSERVICES (new - built from your source code)
  # ===========================================================================

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/eureka-server:latest
    container_name: fraud-shield-eureka-server
    ports:
      - "8761:8761"
    networks:
      - fraud-shield-network
    healthcheck:
      # Eureka's own dashboard at "/" always exists, even without Actuator on
      # the classpath - safer than depending on /actuator/health being present.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/config-server:latest
    container_name: fraud-shield-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
      #SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/configs
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/api-gateway:latest
    container_name: fraud-shield-api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # MUST match user-service's JWT_SECRET exactly - api-gateway VERIFIES
      # the token that user-service SIGNS, using the same shared HMAC key.
      #JWT_SECRET: DockerComposeDevJwtSecretPleaseChangeInProd1234567890ABCDEFGH
      #JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/transaction-service:latest
    container_name: fraud-shield-transaction-service
    ports:
      - "8081:8081"
    environment:
      # Docker-specific config now lives in application-docker.yml, committed
      # in the service's own source tree - see that file for the full list.
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  fraud-detection-service:
    build:
      context: .
      dockerfile: fraud-detection-service/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/fraud-detection-service:latest
    container_name: fraud-shield-fraud-detection-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/alert-service:latest
    container_name: fraud-shield-alert-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      # FIX: alert-service actually uses PostgreSQL, not MongoDB - my original
      # docker-compose.yml guessed wrong before I saw the real config.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/user-service:latest
    container_name: fraud-shield-user-service
    env_file:
      - ./user-service/.env
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # user-service SIGNS the JWT with this secret - api-gateway must use the
      # exact same value to VERIFY it (HS384 is symmetric, one shared key).
      # FIX: this was never set before, so user-service would crash on the
      # first token issue with "Could not resolve placeholder 'JWT_SECRET'".
      #JWT_SECRET: DockerComposeDevJwtSecretPleaseChangeInProd1234567890ABCDEFGH
      #JWT_SECRET: ${JWT_SECRET}
      # Spring Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Spring Cloud Stream Kafka Binder / Spring Cloud Bus
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    image: ghcr.io/saurav-kumarr/fraud-shield/report-service:latest
    container_name: fraud-shield-report-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      # FIX: report-service uses BOTH Postgres AND MongoDB (per its real
      # config) - postgres was missing from this list before.
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  fraud-shield-dashboard:
    build:
      context: ./fraud-shield-dashboard
    image: ghcr.io/saurav-kumarr/fraud-shield/fraud-shield-dashboard:latest
    container_name: fraud-shield-dashboard
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      # nginx proxies /ws directly to alert-service (not through the
      # gateway) - it needs to be reachable and healthy too.
      alert-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - fraud-shield-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  fraud-shield-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
  loki_data:
  tempo_data: