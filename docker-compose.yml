

services:

  # PostgreSQL

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fraud-shield-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fraudshield.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - fraud-shield-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: fraud-shield-postgres
    environment:
      POSTGRES_DB: fraudshielddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud-shield-network

  # MongoDB

  mongo-express:
    image: mongo-express:latest
    container_name: fraud-shield-mongo-express
    ports:
      - "8086:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - fraud-shield-network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6
    container_name: fraud-shield-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fraud-shield-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: fraud-shield-redis
    ports:
      - "6379:6379"
    networks:
      - fraud-shield-network

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fraud-shield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fraud-shield-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fraud-shield-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - fraud-shield-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-shield-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fraud-shield-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: fraud-shield-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - fraud-shield-network
    depends_on:
      - prometheus
      - loki

  # Loki (Log Aggregation)
  loki:
    image: grafana/loki:latest
    container_name: fraud-shield-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fraud-shield-network

  # Alloy (Log Collector)
  alloy:
    image: grafana/alloy:latest
    container_name: fraud-shield-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/log:/var/log:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - fraud-shield-network
    depends_on:
      - loki

  # Tempo (Distributed Tracing)
  tempo:
    image: grafana/tempo:1.5.0
    container_name: fraud-shield-tempo
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    networks:
      - fraud-shield-network

networks:
  fraud-shield-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
  loki_data:
  tempo_data: