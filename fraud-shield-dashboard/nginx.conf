# =============================================================================
#  nginx config for fraud-shield-dashboard
#  Two jobs: (1) serve the built React files, (2) reverse-proxy API and
#  WebSocket calls to api-gateway - so the React code NEVER needs to know
#  api-gateway's hostname. It just calls relative paths like /api/... and /ws,
#  in every environment (local dev, Docker, eventually Kubernetes) unchanged.
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # Docker's internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback. Without this, refreshing the browser on a client-
    # side route (e.g. /dashboard/alerts) would 404, since that path doesn't
    # exist as a real file - only index.html does, and React Router takes it
    # from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API calls - proxied straight through, no path rewriting needed
    # since api-gateway's own routes already expect paths starting with /api
    # (see api-gateway's application-docker.yml route definitions).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP/SockJS) for live fraud alerts. Goes DIRECTLY to
    # alert-service, not api-gateway - that's how the real frontend code
    # connects (bypasses the gateway for this one connection). No trailing
    # slash on the location pattern - SockJS negotiates its transport with
    # sub-paths like /ws/info and /ws/<server>/<session>/websocket, and this
    # prefix match catches all of them, not just an exact /ws/ request.
    location /ws {
        proxy_pass http://alert-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}